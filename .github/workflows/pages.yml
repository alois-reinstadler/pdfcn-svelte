name: Deploy docs and registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm run registry:build
      - run: pnpm run docs:build
        env:
          PDFCN_BASE_PATH: /pdfcn-svelte
      - run: pnpm run docs:check
        env:
          PDFCN_BASE_PATH: /pdfcn-svelte
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test deployed docs and registry
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail

          for path in \
            "" \
            "r/forme/alert.json" \
            "r/takumi/alert.json" \
            "r/forme/theme-modern.json"
          do
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 12 \
              --retry-delay 5 \
              --retry-all-errors \
              --output /dev/null \
              "${BASE_URL%/}/${path}"
          done
