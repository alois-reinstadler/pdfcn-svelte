name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run registry:build
      - name: Check generated registry artifacts
        run: git diff --exit-code -- registry.json public/r
      - run: npm run validate
